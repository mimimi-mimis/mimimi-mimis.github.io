<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>速力チェッカー</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="javascript/fast_checker.js" defer></script>
  </head>
  <body>
    <div class="app-wrapper">
      <h1>速力チェッカー</h1>
      <p>速力を計算し、行動順が入れ替わるかどうかを確認します。</p>
      <h2>速力計算</h2>
      <p>1人目</p>
      <form id="speed-form">
        <label for="speed1">速力:</label>
        <input type="number" id="speed1" name="speed1" required>
        <label for="speed1">Ⅰバフ:</label>
        <input type="number" id="speed_buff1_1" name="speed_buff1_1" min="-10" max="10" step="1" required>
        <label for="speed1">Ⅱバフ:</label>
        <input type="number" id="speed_buff1_2" name="speed_buff1_2" min="-10" max="10" step="1" required>
        <br>
      <p>2人目</p>
        <label for="speed2">速力:</label>
        <input type="number" id="speed2" name="speed2" required>
        <label for="speed2">Ⅰバフ:</label>
        <input type="number" id="speed_buff2_1" name="speed_buff2_1" min="-10" max="10" step="1" required>
        <label for="speed2">Ⅱバフ:</label>
        <input type="number" id="speed_buff2_2" name="speed_buff2_2" min="-10" max="10" step="1" required>
        <br>
        <button type="submit">計算</button>
        <div id="calculation-result" role="status" aria-live="polite"></div>
      </form>
    </div>
  </body>
</html>
