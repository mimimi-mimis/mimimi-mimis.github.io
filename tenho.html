<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天和ジェネレーター | mimimi-mimisの部屋</title>
  <link rel="stylesheet" href="css/style.css?v=20261123-2">
  <script src="javascript/tenho.js?v=20261123-3" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">mimimi-mimisの部屋</a>
      <nav class="nav">
        <a href="index.html">ホーム</a>
        <a href="fast_checker.html">速力チェッカー</a>
        <a href="gacha_simulator.html">ガチャシュミレーター</a>
        <a href="tenho.html" aria-current="page">天和ジェネレーター</a>
      </nav>
    </div>
  </header>

  <div class="app-wrapper">
    <h1 class="page-title">天和ジェネレーター</h1>
    <div class="description">
      <p>天和ジェネレーターは、136枚の山から14枚を配るのを、天和が出るまで繰り返すツールです。</p>
    </div>

    <section class="panel">
      <h2>天和</h2>
      <p>天和が出るまで配牌を繰り返します。</p>
      <div class="btn-row">
        <button type="button" id="tenho-btn" class="generate-btn">天和が出るまで配牌</button>
        <button type="button" id="tenho-stop" class="stop-btn" disabled>中止</button>
      </div>
      <p id="tenho-status" class="status" role="status" aria-live="polite"></p>
      <div id="tenho-result" class="tenho-result" style="display: none;">
        <div id="tenho-tiles"></div>
      </div>
    </section>

    <section class="panel">
      <h2>役満狙い</h2>
      <p>指定した役満の天和が出るまで配牌を繰り返します。</p>
      <p class="note">※出るまで配り続けるので、途中でやめたいときは「中止」ボタンを押してください。</p>
      <div class="field" style="justify-content: flex-start;">
        <label for="yakuman-select">狙う役満:</label>
        <select id="yakuman-select">
          <option value="国士無双">国士無双</option>
          <option value="四暗刻">四暗刻</option>
          <option value="字一色">字一色</option>
          <option value="大四喜">大四喜</option>
          <option value="小四喜">小四喜</option>
          <option value="大七星">大七星</option>
          <option value="緑一色">緑一色</option>
          <option value="紅孔雀">紅孔雀</option>
          <option value="大三元">大三元</option>
          <option value="九蓮宝燈">九蓮宝燈</option>
          <option value="大車輪">大車輪</option>
          <option value="大竹林">大竹林</option>
          <option value="大数隣">大数隣</option>
        </select>
      </div>
      <div class="btn-row">
        <button type="button" id="yakuman-btn" class="generate-btn">役満の天和が出るまで配牌</button>
        <button type="button" id="yakuman-stop" class="stop-btn" disabled>中止</button>
      </div>
      <p id="yakuman-status" class="status" role="status" aria-live="polite"></p>
      <div id="yakuman-result" class="tenho-result" style="display: none;">
        <div id="yakuman-tiles"></div>
      </div>
    </section>

    <p class="home_button"><a href="index.html">ホームに戻る</a></p>
  </div>

  <footer class="site-footer">©2026 | site by mimimi-mimis</footer>
</body>
</html>
